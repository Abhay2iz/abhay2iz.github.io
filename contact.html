<section class="contact-section">

    <h1>Let's Connect</h1>

    <p>
        Have a question, collaboration idea, internship opportunity,
        or just want to say hello? Feel free to reach out.
    </p>

    <form
        action="https://formspree.io/f/mnjeoary"
        method="POST"
        class="contact-form">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required>

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required>

        <textarea
            name="message"
            rows="8"
            placeholder="Your Message"
            required></textarea>

        <button type="submit">
            Send Message 🚀
        </button>

    </form>

</section>
